name: Plugin-CLI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  plugin-cli:
    runs-on: ubuntu-22.04

    steps:
      - name: Set up Go 1.x
        uses: actions/setup-go@fac708d6674e30b6ba41289acaab6d4b75aa0753 # v4.0.1
        with:
          go-version: ${{ matrix.go }}

      - name: Check out code into the Go module directory
        uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9 # v3.5.3

      - name: Build plugins
        run: |
          cd examples/plugin-cli
          make      

      - name: Build CLI
        run: |
          cd examples/plugin-cli
          go build -o plugin-cli

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.ARM_CREDS }}


      - name: Run CLI
        run: |
          cd examples/plugin-cli
          env | sort
          ./plugin-cli
